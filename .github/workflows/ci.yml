name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: pull requests from forks can't write to the repo.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format + clippy + test of the headless crates (shared, server).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p elements-shared -p elements-server --all-targets -- -D warnings

      - name: Test
        run: cargo test -p elements-shared -p elements-server

      # web/src/protocol.ts must match the Rust messages (protocol.rs).
      - name: Protocol types current
        run: |
          UPDATE_PROTOCOL=1 cargo test -p elements-server protocol_ts_is_current
          git diff --exit-code -- web/src/protocol.ts

  # Type-check and build the web app (tsc + vite).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
