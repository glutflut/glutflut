<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glut &amp; Flut – Aushänge drinnen</title>
    <style>
      body { margin: 0; font: 15px system-ui, sans-serif; color: #111; background: #f1f3f5; }
      .tools { padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
      .tools label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
      .tools input { padding: 8px; font: inherit; min-width: 220px; }
      .tools button { padding: 9px 14px; font: inherit; }
      #msg { padding: 0 16px; color: #c92a2a; }
      #screens { padding: 0 16px 16px; }
      #screens li { margin: 6px 0; word-break: break-all; }
      .sheet { width: 210mm; height: 297mm; box-sizing: border-box; padding: 18mm 16mm; margin: 12px auto; background: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: space-between; page-break-after: always; break-after: page; }
      .sheet .kicker { font-size: 20pt; font-weight: 800; letter-spacing: .02em; }
      .sheet .kicker .f { color: #e8590c; } .sheet .kicker .w { color: #1c7ed6; }
      .sheet .name { font-size: 30pt; font-weight: 700; text-align: center; }
      .sheet .qr { width: 150mm; height: 150mm; } .sheet .qr svg { width: 100%; height: 100%; }
      .sheet .how { font-size: 14pt; text-align: center; line-height: 1.4; }
      .sheet .id { font-size: 9pt; color: #555; }
      @media print {
        @page { size: A4; margin: 0; }
        body { background: #fff; }
        .tools, #msg, #screens { display: none; }
        .sheet { margin: 0; }
      }
    </style>
  </head>
  <body>
    <form class="tools" id="form">
      <label>Region <input id="region" placeholder="region-40c3" required /></label>
      <label>Token (Admin; leer = Login) <input id="token" type="password" autocomplete="off" /></label>
      <button>Laden</button>
      <button type="button" id="print">Drucken</button>
    </form>
    <p id="msg"></p>
    <section id="screens" hidden>
      <h2>Bildschirm-Knoten</h2>
      <p>Diese Links enthalten das Geheimnis des Knotens: nur auf dem Gerät am Knoten öffnen, nicht weitergeben. <code>&amp;eink</code> anhängen für langsame Anzeigen.</p>
      <ul id="screen-list"></ul>
    </section>
    <div id="sheets"></div>
    <script type="module" src="/src/indoor-sheets.ts"></script>
  </body>
</html>
