# Flyway config for the Elements schema. Credentials come from db/flyway.sh.
flyway.locations=filesystem:/flyway/sql/migrations
flyway.table=flyway_schema_history
flyway.schemas=public
flyway.defaultSchema=public
# Baselining is a deliberate one-off (flyway.sh adopt|bootstrap), never implicit.
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true
# Neon scales to zero; the first connect can take a few seconds.
flyway.connectRetries=10
flyway.connectRetriesInterval=5
